<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>微信文件预览测试</title>
<style>
  body { font-family: -apple-system, sans-serif; padding: 16px; background: #f0f4ff; }
  .box { padding: 14px; border-radius: 10px; margin: 10px 0; font-size: 15px; line-height: 1.6; }
  #css { background: #2563eb; color: #fff; }
  #js  { background: #e5e7eb; color: #6b7280; }
  #js.ok { background: #10b981; color: #fff; }
  #env { background: #fff; color: #374151; font-size: 12px; word-break: break-all; }
  button { font-size: 16px; padding: 10px 24px; border-radius: 8px; }
</style>
</head>
<body>
<div class="box" id="css">① CSS 测试：这行如果是蓝底白字圆角，说明样式正常</div>
<div class="box" id="js">② JS 测试：灰色 = 脚本没有运行；绿色 = 脚本运行正常</div>
<div class="box" id="env">④ 环境信息：（等待脚本填写）</div>
<button onclick="var e=document.getElementById('js');e.className='box ok';e.textContent='② JS 测试：点击触发成功（绿色）✓';">③ 点我：② 应该变绿</button>
<script>
  var el = document.getElementById('js');
  el.className = 'box ok';
  el.textContent = '② JS 测试：打开即自动变绿 = 脚本运行正常 ✓';
  document.getElementById('env').textContent = '④ 环境：' + navigator.userAgent.slice(0, 60) + ' · 视口 ' + window.innerWidth + '×' + window.innerHeight;
</script>
</body>
</html>
